<div class="col" style="height:100%; display:flex; flex-direction:column;">
  <div class="in" style="padding-top:24px;">

      <p class="lede" style="margin:0 0 24px 0;">[One line: delivery promise]</p>
    </div>
  </div>

  <div class="in" style="display:flex; justify-content:center; padding-bottom:0;">
    <div class="card" style="width:350px; display:flex; flex-direction:column; gap:12px;">
      <div class="slot" data-label="Piece photo 1" data-size="1000x1250" style="width:100%; height:300px; background:#f0ede8; border-radius:4px;"></div>
      <div>
        <h3 class="h3" style="margin:0 0 4px 0;">[Piece name]</h3>
        <p class="small" style="margin:0;">[Timber] frame · [Fabric] · [Detail]</p>
      </div>
      <div class="row" style="display:flex; gap:8px; align-items:center;">
        <span class="dot on" style="background:#8a6f5c; width:16px; height:16px; border-radius:50%; display:inline-block;"></span>
        <span class="dot" style="background:#c9b8a8; width:16px; height:16px; border-radius:50%; display:inline-block;"></span>
        <span class="dot" style="background:#4a4a4a; width:16px; height:16px; border-radius:50%; display:inline-block;"></span>
      </div>
      <div class="row" style="display:flex; justify-content:space-between; align-items:center; gap:12px;">
        <span class="price" style="font-family:serif; font-size:20px;">LKR [price]</span>
        <button class="btn" style="display:inline-flex; align-items:center; gap:8px; padding:12px 16px; background:#1a1a1a; color:#fff; border:none; border-radius:4px; font-size:14px; cursor:pointer; min-height:44px;">
          Buy on WhatsApp
          <i class="ic ic-message-circle" style="font-style:normal;">✆</i>
        </button>
      </div>
    </div>

  <div class="in" style="padding-top:20px; padding-bottom:0;">
    <div style="text-align:center;">
      <p class="small" style="margin:0 0 8px 0;">01 / 04</p>
      <div class="progress" style="width:100%; height:2px; background:#e0ddd8; position:relative;">
        <i style="width:25%; display:block; height:2px; background:#1a1a1a;"></i>
      </div>
    </div>
  </div>

  <div class="grow" style="flex-grow:1;"></div>
</div>
