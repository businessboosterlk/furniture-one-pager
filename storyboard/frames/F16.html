<div class="col" style="height:100%; display:flex; flex-direction:column;">
  <div class="in">
    <div class="hdr" style="display:flex; justify-content:space-between; align-items:center; padding-top:24px; padding-bottom:24px;">
      <div class="brand">[Brand name]</div>
      <div class="nav" style="display:flex; gap:32px; align-items:center;">
        <span>Shop</span>
        <span>Build yours</span>
        <span>Craft</span>
        <span>Visit</span>
        <span class="btn" style="display:inline-flex; align-items:center; gap:8px; padding:10px 20px;">Message us</span>
      </div>
    </div>
  </div>

  <div class="in" style="flex-grow:1; display:flex; flex-direction:column; justify-content:center;">
    <div style="display:flex; gap:64px; align-items:flex-start;">
      <div style="width:520px; flex-shrink:0;">
        <h2 style="margin:0 0 24px 0;">Come and sit on it.</h2>
        <div style="display:flex; align-items:center; gap:12px; margin-bottom:16px;">
          <i class="ic ic-map-pin"></i>
          <span class="small">[Showroom address]</span>
        </div>
        <div style="display:flex; align-items:center; gap:12px; margin-bottom:32px;">
          <i class="ic ic-clock"></i>
          <span class="small">[Opening hours]</span>
        </div>
        <div style="display:flex; gap:16px;">
          <span class="btn" style="display:inline-flex; align-items:center; gap:8px; padding:12px 24px;">
            <i class="ic ic-message-circle"></i> WhatsApp us
          </span>
          <span class="btn-o" style="display:inline-flex; align-items:center; gap:8px; padding:12px 24px;">
            <i class="ic ic-phone"></i> Call [Phone number]
          </span>
        </div>
      </div>
      <div style="flex-grow:1;">
        <div class="slot" data-label="Map" data-size="1200x800" style="width:100%; height:380px;"></div>
      </div>
    </div>
  </div>

  <div class="in">
    <div class="rule" style="border-top:1px solid #e5e5e5; margin-bottom:24px;"></div>
    <div style="display:flex; justify-content:space-between; align-items:center; padding-bottom:24px;">
      <div class="brand">[Brand name]</div>
      <div class="nav" style="display:flex; gap:32px; align-items:center;">
        <span class="small">Shop</span>
        <span class="small">Build yours</span>
        <span class="small">Craft</span>
        <span class="small">Visit</span>
      </div>
      <div style="display:flex; align-items:center; gap:16px;">
        <i class="ic ic-instagram"></i>
        <span class="small">[Instagram handle]</span>
        <span class="small">© [Year]</span>
      </div>
    </div>
  </div>
</div>
