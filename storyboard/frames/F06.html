<div class="col" style="height:100%; display:flex; flex-direction:column;">
  <div class="in" style="padding:0 48px;">
    <div class="hdr" style="display:flex; justify-content:space-between; align-items:center; padding:24px 0 0 0;">
      <div class="brand">[Brand name]</div>
      <div class="nav" style="display:flex; gap:32px; align-items:center;">
        <span>Rooms</span>
        <span>Pieces</span>
        <span>Journal</span>
        <span>Contact</span>
        <span class="btn" style="display:inline-flex; align-items:center; gap:8px; padding:10px 20px; background:#1a1a1a; color:#fff; border-radius:2px;">
          <i class="ic ic-message-circle"></i> Message us
        </span>
      </div>
    </div>
  </div>

  <div class="in" style="padding:0 48px; flex-grow:1; display:flex; align-items:center;">
    <div style="display:flex; gap:48px; width:100%; align-items:flex-start;">
      <!-- Left column 340px -->
      <div style="width:340px; flex-shrink:0; display:flex; flex-direction:column; gap:0;">
        <div class="eyebrow" style="margin-bottom:8px;">Rooms</div>
        <h2 style="margin:0 0 12px 0;">One home. Four rooms.</h2>
        <div class="lede" style="margin-bottom:32px;">Walk through. Tap any piece you like.</div>
        
        <div style="display:flex; flex-direction:column; gap:8px;">
          <div class="pick on" style="width:100%; height:48px; display:flex; align-items:center; padding:0 16px; border:1px solid #1a1a1a; background:#1a1a1a; color:#fff; box-sizing:border-box;">[Living]</div>
          <div class="pick" style="width:100%; height:48px; display:flex; align-items:center; padding:0 16px; border:1px solid #d0d0d0; box-sizing:border-box;">[Dining]</div>
          <div class="pick" style="width:100%; height:48px; display:flex; align-items:center; padding:0 16px; border:1px solid #d0d0d0; box-sizing:border-box;">[Bedroom]</div>
          <div class="pick" style="width:100%; height:48px; display:flex; align-items:center; padding:0 16px; border:1px solid #d0d0d0; box-sizing:border-box;">[Study]</div>
        </div>
        
        <div class="small" style="margin-top:24px;">01 / 04</div>
      </div>

      <!-- Right column fills rest -->
      <div style="flex:1; display:flex; flex-direction:column; gap:16px; min-width:0;">
        <div class="slot" data-label="Room photo 1 of 4, same camera spot" data-size="2400x1350" style="width:100%; height:520px; position:relative; background:#e8e4de; border-radius:2px;">
          <div class="chip" style="position:absolute; left:80px; top:300px; display:flex; align-items:center; gap:8px; background:#fff; padding:8px 12px; border-radius:20px; box-shadow:0 2px 8px rgba(0,0,0,0.08);">
            <span class="dot on" style="width:12px; height:12px; border-radius:50%; background:#8a6f5c; display:inline-block;"></span>
            <span>[Piece name]</span>
          </div>
          <div class="chip" style="position:absolute; left:520px; top:360px; display:flex; align-items:center; gap:8px; background:#fff; padding:8px 12px; border-radius:20px; box-shadow:0 2px 8px rgba(0,0,0,0.08);">
            <span class="dot on" style="width:12px; height:12px; border-radius:50%; background:#6b4f3a; display:inline-block;"></span>
            <span>[Piece name]</span>
          </div>
        </div>
        <div class="progress" style="width:100%; height:1px; background:#e0ddd8; position:relative;">
          <i style="width:25%; display:block; height:1px; background:#1a1a1a;"></i>
        </div>
      </div>
    </div>
  </div>
</div>
