<div class="col" style="height:100%;">
  <div class="in" style="display:flex; flex-direction:column; gap:12px; padding-top:16px; padding-bottom:16px; height:100%;">
    <div style="text-align:center;">
      <div class="eyebrow">Build yours</div>
      <h2 style="margin:4px 0 0 0;">Make it yours.</h2>
      <div class="lede" style="margin-top:4px;">Pick a start, a size and a fabric. The price moves with you.</div>
    </div>

    <div style="display:flex; flex-direction:column; gap:8px; margin-top:4px;">
      <div class="steps" style="display:flex; justify-content:space-between; gap:8px;">
        <span>01 Start</span>
        <span class="on">02 Size</span>
        <span>03 Fabric</span>
        <span>04 Send</span>
      </div>
      <div class="progress" style="height:2px; background:#e0e0e0; position:relative;">
        <i style="width:50%; display:block; height:2px; background:#1a1a1a;"></i>
      </div>
    </div>

    <div style="display:flex; flex-direction:column; gap:6px; margin-top:8px;">
      <div style="display:flex; justify-content:center; gap:8px;">
        <button class="pick on" style="width:64px; height:44px;">01</button>
        <button class="pick" style="width:64px; height:44px;">02</button>
        <button class="pick" style="width:64px; height:44px;">03</button>
      </div>
      <div class="small" style="text-align:center;">[Preset name]</div>
    </div>

    <div style="display:flex; flex-direction:column; gap:6px;">
      <div class="slot" data-label="Drawing with measurements" data-size="1200x1200" style="width:100%; height:130px; background:#f5f2ee; border:1px solid #e0ddd8; border-radius:4px;"></div>
      <div class="small" style="text-align:center;">[Width] mm · [Depth] mm · [Seat height] mm</div>
    </div>

    <div style="display:flex; justify-content:center; gap:8px; margin-top:4px;">
      <button class="pick" style="width:auto; padding:0 16px; height:44px;">[Size 1]</button>
      <button class="pick on" style="width:auto; padding:0 16px; height:44px;">[Size 2]</button>
      <button class="pick" style="width:auto; padding:0 16px; height:44px;">[Size 3]</button>
    </div>

    <div style="display:flex; justify-content:center; gap:12px; margin-top:4px;">
      <div class="chip" style="display:flex; align-items:center; gap:6px; padding:8px 12px; border:1px solid #e0ddd8; border-radius:24px;">
        <span class="dot on" style="background:#8a6f5c; width:16px; height:16px; border-radius:50%; display:inline-block;"></span>
        <span>[Fabric 1]</span>
      </div>
      <div class="chip" style="display:flex; align-items:center; gap:6px; padding:8px 12px; border:1px solid #e0ddd8; border-radius:24px;">
        <span class="dot" style="background:#b8a99a; width:16px; height:16px; border-radius:50%; display:inline-block;"></span>
        <span>[Fabric 2]</span>
      </div>
    </div>

    <div style="display:flex; justify-content:space-between; align-items:baseline; margin-top:8px;">
      <span class="price" style="font-size:1.4rem;">LKR [price]</span>
      <span class="small">live price</span>
    </div>

    <div style="flex-grow:1;"></div>

    <button class="btn" style="width:100%; height:48px; display:flex; align-items:center; justify-content:center; gap:8px; background:#1a1a1a; color:#fff; border:none; border-radius:2px;">
      <i class="ic ic-message-circle"></i>
      Send my build on WhatsApp
    </button>
  </div>
</div>
