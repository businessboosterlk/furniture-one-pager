<div class="col" style="height:100%; display:flex; flex-direction:column;">
  <div class="in" style="padding-top:24px;">
    <div class="row" style="display:flex; gap:8px; justify-content:center; flex-wrap:wrap;">
      <span class="pick on" style="display:inline-block; padding:10px 16px; min-height:44px; box-sizing:border-box;">[Living]</span>
      <span class="pick" style="display:inline-block; padding:10px 16px; min-height:44px; box-sizing:border-box;">[Dining]</span>
      <span class="pick" style="display:inline-block; padding:10px 16px; min-height:44px; box-sizing:border-box;">[Bedroom]</span>
      <span class="pick" style="display:inline-block; padding:10px 16px; min-height:44px; box-sizing:border-box;">[Study]</span>
    </div>
    <h2 style="text-align:center; margin-top:24px; margin-bottom:8px;">One home. Four rooms.</h2>
    <p class="lede" style="text-align:center; margin:0 0 24px 0;">Walk through. Tap any piece you like.</p>
  </div>

  <div class="slot" data-label="Room photo 1 of 4, same camera spot" data-size="2400x1350" style="width:100%; height:300px; position:relative; overflow:hidden;">
    <div class="chip" style="position:absolute; left:16px; bottom:36px; display:flex; align-items:center; gap:8px; background:rgba(255,255,255,0.9); padding:8px 12px; border-radius:4px;">
      <span class="dot on" style="display:inline-block; width:12px; height:12px; border-radius:50%; background:#8b6f5e;"></span>
      <span class="small" style="font-size:14px;">[Piece name]</span>
    </div>
  </div>

  <div class="in" style="padding-top:16px; padding-bottom:0;">
    <div class="row" style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
      <span class="small">01 / 04</span>
      <span class="btn-t" style="display:inline-flex; align-items:center; gap:4px; min-height:44px; padding:0 4px;">
        Next room <i class="ic ic-arrow-right"></i>
      </span>
    </div>
    <div class="progress" style="width:100%; height:1px; background:#e0ddd8; position:relative;">
      <i style="width:25%; display:block; height:1px; background:#2b2b2b;"></i>
    </div>
  </div>
</div>
