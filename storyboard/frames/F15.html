<div class="col" style="height:100%; display:flex; flex-direction:column;">
  <div class="in" style="flex:1; display:flex; flex-direction:column; justify-content:center; gap:12px; padding-top:20px; padding-bottom:20px;">
    <h2 style="text-align:center; margin:0;">Come and sit on it.</h2>
    
    <div class="row" style="display:flex; justify-content:center; align-items:center; gap:8px;">
      <i class="ic ic-map-pin"></i>
      <small>[Showroom address]</small>
    </div>
    
    <div class="row" style="display:flex; justify-content:center; align-items:center; gap:8px;">
      <i class="ic ic-clock"></i>
      <small>[Opening hours]</small>
    </div>
    
    <div style="display:flex; flex-direction:column; gap:8px; margin-top:4px;">
      <button class="btn" style="width:100%; display:flex; align-items:center; justify-content:center; gap:8px; min-height:44px;">
        <i class="ic ic-message-circle"></i>
        WhatsApp us
      </button>
      <button class="btn-o" style="width:100%; display:flex; align-items:center; justify-content:center; gap:8px; min-height:44px;">
        <i class="ic ic-phone"></i>
        Call [Phone number]
      </button>
    </div>
    
    <div class="slot" data-label="Map" data-size="1200x800" style="width:100%; height:130px; margin-top:4px;"></div>
  </div>
  
  <div class="in" style="padding-bottom:20px;">
    <div class="rule" style="margin-bottom:16px;"></div>
    
    <div style="text-align:center;">
      <div class="brand" style="margin-bottom:12px;">[Brand name]</div>
      
      <div class="row" style="display:flex; justify-content:center; gap:16px; margin-bottom:12px;">
        <small>Shop</small>
        <small>Build yours</small>
        <small>Craft</small>
        <small>Visit</small>
      </div>
      
      <div class="row" style="display:flex; justify-content:center; align-items:center; gap:8px; margin-bottom:8px;">
        <i class="ic ic-instagram"></i>
        <small>[Instagram handle]</small>
      </div>
      
      <small>© [Year] [Brand name]</small>
    </div>
  </div>
</div>
