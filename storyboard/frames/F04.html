<div class="col" style="height:100%; display:flex; flex-direction:column;">
  <div class="in" style="padding:0 48px; flex-shrink:0;">
    <div class="hdr" style="display:flex; justify-content:space-between; align-items:center; padding:24px 0 16px 0;">
      <div class="brand">[Brand name]</div>
      <div class="nav" style="display:flex; gap:32px; align-items:center;">
        <span>Shop</span>
        <span>Build yours</span>
        <span>Craft</span>
        <span>Visit</span>
        <span class="btn" style="display:inline-flex; align-items:center; gap:8px; padding:10px 20px; background:#1a1a1a; color:#fff; border-radius:2px;">
          <i class="ic ic-message-circle"></i> Message us
        </span>
      </div>
    </div>
  </div>
  <div class="grow" style="display:flex; align-items:center; padding:0 48px; flex:1; min-height:0;">
    <div style="display:flex; gap:64px; width:100%; align-items:center;">
      <div style="width:560px; flex-shrink:0;">
        <div class="eyebrow" style="margin-bottom:16px;">[Category] · [Timber] · [Fabric]</div>
        <div class="poster" style="margin-bottom:24px;">[Piece name]</div>
        <div class="lede" style="margin-bottom:32px;">Buy it ready. Or build it yours.</div>
        <div style="display:flex; gap:16px; margin-bottom:32px;">
          <span class="btn" style="padding:12px 24px; background:#1a1a1a; color:#fff; border-radius:2px;">Ready to buy · from LKR [price]</span>
          <span class="btn-o" style="padding:12px 24px; border:1px solid #1a1a1a; border-radius:2px; display:inline-flex; align-items:center; gap:8px;">Build your own <i class="ic ic-arrow-right"></i></span>
        </div>
        <div style="display:flex; gap:12px; align-items:center; margin-bottom:16px;">
          <span class="pick">[Size 1]</span>
          <span class="pick">[Size 2]</span>
          <span class="pick">[Size 3]</span>
        </div>
        <div style="display:flex; gap:12px; align-items:center;">
          <span class="dot on" style="background:#8b6f4e; width:20px; height:20px; border-radius:50%; display:inline-block;"></span>
          <span class="dot" style="background:#6b5b4e; width:20px; height:20px; border-radius:50%; display:inline-block;"></span>
          <span class="dot" style="background:#a89f91; width:20px; height:20px; border-radius:50%; display:inline-block;"></span>
        </div>
      </div>
      <div style="flex:1; position:relative; min-width:0;">
        <div class="slot" data-label="Hero photo: the piece in a calm room" data-size="1600x1200" style="width:100%; height:520px; background:#e8e4de; border-radius:2px;"></div>
        <div style="position:absolute; left:-48px; bottom:-24px; width:220px;">
          <div class="slot" data-label="Pencil drawing" data-size="1200x1200" style="width:220px; height:220px; background:#f0ede8; border-radius:2px;"></div>
          <div style="margin-top:12px; display:flex; flex-direction:column; gap:4px;">
            <span class="small">[Width] mm</span>
            <span class="small">[Depth] mm</span>
            <span class="small">[Seat height] mm</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
